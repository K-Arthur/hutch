[project]
name = "hutch"
version = "0.1.0"
description = "Local-first, open-source multi-bot agent platform. Your bots. Your machine. Your rules."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kevin Arthur" }]
requires-python = ">=3.11"
keywords = ["agents", "automation", "llm", "local-first", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "croniter>=2.0",
    "openai>=1.40",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "cryptography>=42.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "webauthn>=2.2,<3",
    "python-docx>=1.2",
    "xlsxwriter>=3.2",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "weasyprint>=70",
    "pypdf>=6.20",
    "pypdfium2>=5.14",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
anthropic = ["anthropic>=1.12"]
#: live Bluesky Jetstream streaming (the reader reports 'unsupported' without it)
jetstream = ["websockets>=12"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "hypothesis>=6.100", "anthropic>=1.12"]

[project.scripts]
hutch = "hutch.cli:main"

[project.urls]
Homepage = "https://github.com/K-Arthur/hutch"
Documentation = "https://github.com/K-Arthur/hutch/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hutch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
