[project]
name = "hutch"
version = "0.1.0"
description = "Local-first, open-source multi-bot agent platform. Your bots. Your machine. Your rules."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kevin Arthur" }]
requires-python = ">=3.11"
keywords = ["agents", "automation", "llm", "local-first", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "croniter>=2.0",
    "openai>=1.40",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[project.scripts]
hutch = "hutch.cli:main"

[project.urls]
Homepage = "https://github.com/kevinarthur/hutch"
Documentation = "https://github.com/kevinarthur/hutch/tree/master/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hutch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
