[package]
name = "hutch-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Hutch native desktop host"

[build-dependencies]
tauri-build = "=2.7.2"

[dependencies]
hutch-process-guard = { path = "process-guard" }
tauri = { version = "=2.12.2", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-opener = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "=0.10.3"
hmac-sha256 = "=1.1.15"
cookie = "=0.18.2"

[profile.release]
codegen-units = 1
lto = true
strip = true
