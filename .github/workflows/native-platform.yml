name: Native platform boundaries

# Manual while desktop ports are incomplete. No publication or signing authority.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    # Standard hosted compute is free for public repositories; never run this matrix while private.
    if: ${{ !github.event.repository.private }}
    name: Boundaries (${{ matrix.target }})
    timeout-minutes: 15
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: windows-x64
            runner: windows-2025
          - target: macos-arm64
            runner: macos-14
          - target: macos-x64
            runner: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified 2026-10-26
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, verified 2026-10-26
        with:
          python-version: '3.13.15'
      - name: Install locked development environment
        run: |
          python -m pip install uv==0.12.24
          uv sync --frozen --extra dev
      - name: Record native host and source
        env:
          HUTCH_SOURCE_COMMIT: ${{ github.sha }}
          HUTCH_NATIVE_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p .validation/native-platform
          uv run --frozen --no-sync python scripts/record_native_host.py --output .validation/native-platform/host.json
      - name: Exercise kernel locks, native credentials and concurrent skill writes
        run: >-
          uv run --frozen --no-sync pytest -q
          tests/test_platform_locking.py tests/test_skills.py tests/test_native_credentials.py tests/test_native_host_record.py
          -k 'platform_locking or concurrent_registry_mutations_serialize or native_credentials or native_host_record'
          --junitxml=.validation/native-platform/python.xml
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Check native process guard
        run: |
          cargo +1.97.1 fmt --manifest-path desktop/process-guard/Cargo.toml --all -- --check
          cargo +1.97.1 clippy --locked --manifest-path desktop/process-guard/Cargo.toml --all-targets -- -D warnings
          cargo +1.97.1 test --locked --manifest-path desktop/process-guard/Cargo.toml -- --nocapture > .validation/native-platform/process-guard.log 2>&1
      - name: Emit bounded evidence in job logs
        if: ${{ always() }}
        run: python scripts/record_native_host.py --emit .validation/native-platform
