name: Native platform boundaries

# Manual while desktop ports are incomplete. No publication or signing authority.
on:
  workflow_dispatch:
    inputs:
      included_runner_budget_verified:
        description: Included runner minutes and zero paid overage have been verified for this run
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    if: ${{ inputs.included_runner_budget_verified }}
    name: Boundaries (${{ matrix.target }})
    timeout-minutes: 15
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: ubuntu-24.04-x64
            runner: ubuntu-24.04
          - target: windows-server-2025-x64
            runner: windows-2025
          - target: macos-14-arm64
            runner: macos-14
          - target: macos-15-intel
            runner: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified 2026-10-26
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, verified 2026-10-26
        with:
          python-version: '3.13.15'
      - name: Install locked development environment
        run: |
          python -m pip install uv==0.12.24
          uv sync --frozen --extra dev
      - name: Record native host and source
        env:
          HUTCH_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p .validation/native-platform
          uv run --frozen --no-sync python scripts/record_native_host.py --output .validation/native-platform/host.json
      - name: Exercise kernel locking and concurrent skill writes
        run: >-
          uv run --frozen --no-sync pytest -q
          tests/test_platform_locking.py tests/test_skills.py
          -k 'platform_locking or concurrent_registry_mutations_serialize'
          --junitxml=.validation/native-platform/python.xml
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Check native process guard
        run: |
          cargo +1.97.1 fmt --manifest-path desktop/process-guard/Cargo.toml --all -- --check
          cargo +1.97.1 clippy --locked --manifest-path desktop/process-guard/Cargo.toml --all-targets -- -D warnings
          cargo +1.97.1 test --locked --manifest-path desktop/process-guard/Cargo.toml -- --nocapture > .validation/native-platform/process-guard.log 2>&1
      - name: Retain bounded private evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, verified 2026-10-26
        with:
          name: native-boundaries-${{ matrix.target }}
          path: .validation/native-platform/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
