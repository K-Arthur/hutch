<form class="onboarding-form" method="post" action="/onboarding/request" data-onboarding-form>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="revision" value="{{ revision }}">
  <div class="onboarding-field">
    <label class="onboarding-label" for="request">Your request <span class="onboarding-req" aria-hidden="true">*</span></label>
    <textarea class="onboarding-textarea" id="request" name="request" rows="6" required maxlength="20000"
              {%- if field_error %} aria-invalid="true" aria-describedby="request-help request-error"{% else %} aria-describedby="request-help"{% endif %}>{{ request_text }}</textarea>
    <p class="onboarding-help" id="request-help">Stored only in this machine's Hutch data directory. Nothing is sent until you continue to an AI service.</p>
    {% if field_error %}<p class="onboarding-field-error" id="request-error">{{ field_error }}</p>{% endif %}
  </div>
  <p class="onboarding-saving" role="status" aria-live="polite" data-saving-status hidden>Saving...</p>
  <div class="onboarding-form-actions">
    <button class="btn primary" type="submit" data-submit>{{ submit_label }}</button>
    <a class="btn ghost" href="{{ cancel_href }}">{{ cancel_label }}</a>
  </div>
</form>
