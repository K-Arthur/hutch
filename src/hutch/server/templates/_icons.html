{#- Inline SVG icons (24x24, stroke). The repo bans emoji / icon characters in UI surfaces; every glyph is SVG. -#}
{% macro icon(name, size=16, cls="") -%}
<svg class="ico {{ cls }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "home" %}<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/>
{%- elif name == "bot" %}<rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4"/><circle cx="9" cy="13.5" r="1"/><circle cx="15" cy="13.5" r="1"/>
{%- elif name == "play" %}<path d="M7 5v14l12-7z"/>
{%- elif name == "stop" %}<rect x="6" y="6" width="12" height="12" rx="2"/>
{%- elif name == "pause" %}<path d="M9 5v14M15 5v14"/>
{%- elif name == "shield" %}<path d="M12 3 20 6v6c0 4.5-3.4 7.7-8 9-4.6-1.3-8-4.5-8-9V6z"/><path d="m9 12 2.2 2.2L15.5 10"/>
{%- elif name == "clock" %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "check" %}<path d="m5 12.5 4.5 4.5L19 7.5"/>
{%- elif name == "x" %}<path d="M6 6l12 12M18 6 6 18"/>
{%- elif name == "alert" %}<path d="M12 4 22 20H2z"/><path d="M12 10v4.5M12 17.6v.01"/>
{%- elif name == "inbox" %}<path d="M3 13.5 6 5h12l3 8.5V19H3z"/><path d="M3 13.5h5.5a3.5 3.5 0 0 0 7 0H21"/>
{%- elif name == "list" %}<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>
{%- elif name == "calendar" %}<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>
{%- elif name == "cpu" %}<rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/>
{%- elif name == "chart" %}<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
{%- elif name == "brain" %}<path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3.5 3.5 0 0 0 2.5 5.7A3 3 0 0 0 12 19V5a2 2 0 0 0-3-1z"/><path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3.5 3.5 0 0 1-2.5 5.7A3 3 0 0 1 12 19"/>
{%- elif name == "plan" %}<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.5 8l3.5 8M16.5 8 13 16"/>
{%- elif name == "plus" %}<path d="M12 5v14M5 12h14"/>
{%- elif name == "trash" %}<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>
{%- elif name == "arrow" %}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == "arrow-left" %}<path d="M19 12H5M11 6l-6 6 6 6"/>
{%- elif name == "refresh" %}<path d="M20 11a8 8 0 0 0-14.5-3.5L4 9M4 13a8 8 0 0 0 14.5 3.5L20 15M4 4v5h5M20 20v-5h-5"/>
{%- elif name == "terminal" %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/>
{%- elif name == "file" %}<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>
{%- elif name == "globe" %}<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>
{%- elif name == "lock" %}<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
{%- elif name == "user" %}<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.8 3.6-5.5 7-5.5s6.2 1.7 7 5.5"/>
{%- elif name == "layers" %}<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>
{%- elif name == "zap" %}<path d="M13 3 5 13.5h6L10 21l9-11h-6z"/>
{%- elif name == "eye" %}<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
{%- elif name == "download" %}<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>
{%- elif name == "spinner" %}<path d="M12 3a9 9 0 0 1 9 9" class="spin-arc"/>
{%- elif name == "mobile" %}<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>
{%- else %}<circle cx="12" cy="12" r="9"/>
{%- endif %}
</svg>
{%- endmacro %}
