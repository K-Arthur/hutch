<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hutch — your bots, your machine</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 28 9v14L16 30 4 23V9z' fill='none' stroke='%2352a8ff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2352a8ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/model-switcher.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/chat" aria-label="hutch — home">
      <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2 28 9v14L16 30 4 23V9z" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
        <circle cx="16" cy="16" r="4" fill="var(--accent)"/>
      </svg>
      <span>hutch</span>
    </a>
    <nav aria-label="Primary" id="primary-nav">
      <a href="#/chat" data-nav="chat">Studio</a>
      <a href="#/overview" data-nav="overview">Overview</a>
      <a href="#/bots" data-nav="bots">Bots</a>
      <a href="#/runs" data-nav="runs">Runs</a>
      <a href="#/approvals" data-nav="approvals">Approvals <span id="approval-badge" class="badge hidden">0</span></a>
    </nav>
    <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="primary-nav">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="topbar-right">
      <button class="primary small" id="topbar-new-bot">+ New Bot</button>
      <span id="daemon-pill" class="pill daemon connecting" data-state="connecting" title="Checking executor health…">checking</span>
    </div>
  </header>

  <main id="view">
    <div class="empty-state">
      <div class="spinner" role="status" aria-label="Loading"></div>
      <p>Loading…</p>
    </div>
  </main>

  <!-- Bounded status announcer: only lifecycle changes (run started/finished,
       approval required, connection lost) are announced here — never the whole
       view on every render, and never each streamed token. -->
  <div id="live-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <script src="/static/model-switcher.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
