apiVersion: hutch.ai/v1
kind: BotConfig
spec:
  name: guided-release-reviewer
  display_name: Release Notes Reviewer
  template: null
  description: Summarize project release notes
  instructions: Review release notes and prepare a short summary of changes that affect
    our project.
  model: openai/gpt-4o-mini
  inference_mode: hybrid
  tools:
  - read_file
  memory_enabled: false
  cron: 0 9 * * 1
  timezone: UTC
  catch_up: coalesce
  schedule_prompt: Review release notes and report important changes.
  approval_mode: ask
  risk_tier: supervised
  command_rules: []
  workspace_mode: managed
  local_browser_handoff: true
  limits:
    max_steps: 24
    timeout_seconds: 900
    daily_token_cap: 200000
    max_turn_tokens: 0
    max_cost_usd: 0.0
    daily_cost_cap_usd: 0.0
